name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Test
        run: go test ./...

      - name: Smoke test compiled server
        run: go test -tags=smoke -v ./tests/smoke

  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/akritas-linux-amd64 ./cmd/akritas
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/akritas-linux-arm64 ./cmd/akritas
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/akritas-darwin-amd64 ./cmd/akritas
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/akritas-darwin-arm64 ./cmd/akritas
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/akritas-windows-amd64.exe ./cmd/akritas
          cd dist
          sha256sum akritas-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/akritas-linux-amd64
            dist/akritas-linux-arm64
            dist/akritas-darwin-amd64
            dist/akritas-darwin-arm64
            dist/akritas-windows-amd64.exe
            dist/SHA256SUMS
